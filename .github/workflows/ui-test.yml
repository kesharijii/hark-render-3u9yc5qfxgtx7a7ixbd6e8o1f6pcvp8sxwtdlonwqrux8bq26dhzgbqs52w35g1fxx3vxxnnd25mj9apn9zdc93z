name: ui-test
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save puppeteer-core@23 && node ui/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-shots, path: shots/, retention-days: 1 }
