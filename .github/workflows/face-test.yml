name: face-test
on:
  workflow_dispatch:
    inputs:
      drive_id: { default: 1ceiLOVFyYHs4uF5WIFf88RhegzyyFvx2 }
      mode: { default: stills }
      wav: { default: tts/test/face_line.wav }
      spp: { default: "16" }
env:
  BLENDER_VERSION: "4.3.2"
  HDRI: https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/venice_sunset_2k.hdr
jobs:
  face:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        uses: actions/cache@v4
        with: { path: "~/blender\n~/mhdata", key: "blender-${{ env.BLENDER_VERSION }}-mh-cc0-v1" }
      - name: Fetch
        run: |
          set -e
          if [ ! -x ~/blender/blender ]; then V=${{ env.BLENDER_VERSION }}; curl -fsSL --retry 3 -o /tmp/b.tar.xz https://download.blender.org/release/Blender${V%.*}/blender-$V-linux-x64.tar.xz; mkdir -p ~/blender && tar -xJf /tmp/b.tar.xz -C ~/blender --strip-components=1; fi
          mkdir -p ~/host
          curl -fsSL --retry 3 -o ~/host/host.blend "https://drive.usercontent.google.com/download?id=${{ inputs.drive_id }}&export=download&confirm=t"
          curl -fsSL --retry 3 -o ~/host/sky.hdr "${{ env.HDRI }}"
          sudo apt-get install -y -q --no-install-recommends libxi6 libxkbcommon0 libsm6 libgl1 ffmpeg >/dev/null 2>&1 || true
      - name: Render
        env: { SPP: "${{ inputs.spp }}" }
        run: |
          mkdir -p out
          ~/blender/blender -b ~/host/host.blend -P render/face_test.py -- $PWD/out ~/host/sky.hdr $PWD/${{ inputs.wav }} ${{ inputs.mode }} 2>&1 | grep -v "^Fra:" | tee out/log.txt | grep -E "FACEBONE|DONE|Error|Traceback" -A3 | head -150
          if [ "${{ inputs.mode }}" = "clip" ]; then ffmpeg -v error -framerate 15 -i out/f_%04d.png -i ${{ inputs.wav }} -itsoffset 0.4667 -map 0:v -map 1:a -r 30 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest out/face_clip.mp4 || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: face-test, path: "out/*.png\nout/*.mp4\nout/log.txt", retention-days: 1 }
