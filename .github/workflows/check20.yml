name: check20

on:
  workflow_dispatch:
    inputs:
      ep: { default: craft_v20 }
      dry: { default: v20 }
      spp: { default: "24" }
      host_id: { default: 1ceiLOVFyYHs4uF5WIFf88RhegzyyFvx2 }

permissions:
  contents: read
  actions: read

env:
  BLENDER_VERSION: "4.3.2"
  HDRIS: "potsdamer_platz satara_night cobblestone_street_night lebombo small_harbour_sunset"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        uses: actions/cache/restore@v4
        with: { path: "~/blender\n~/mhdata", key: "blender-${{ env.BLENDER_VERSION }}-mh-cc0-v1" }
      - name: Cache assets
        uses: actions/cache/restore@v4
        with: { path: ~/assets, key: "short-assets-${{ inputs.host_id }}-v1" }
      - name: Fetch
        run: |
          set -e
          if [ ! -x ~/blender/blender ]; then V=${{ env.BLENDER_VERSION }}; curl -fsSL --retry 3 -o /tmp/b.tar.xz https://download.blender.org/release/Blender${V%.*}/blender-$V-linux-x64.tar.xz; mkdir -p ~/blender && tar -xJf /tmp/b.tar.xz -C ~/blender --strip-components=1; fi
          mkdir -p ~/assets; cd ~/assets
          [ -s host.blend ] || curl -fsSL --retry 3 -o host.blend "https://drive.usercontent.google.com/download?id=${{ inputs.host_id }}&export=download&confirm=t"
          for h in $HDRIS; do [ -s ${h}_2k.hdr ] || curl -fsSL --retry 3 -o ${h}_2k.hdr https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/${h}_2k.hdr; done
          sudo apt-get install -y -q --no-install-recommends libxi6 libxkbcommon0 libsm6 libgl1 >/dev/null 2>&1 || true
      - name: Render
        timeout-minutes: 335
        env: { SPP: "${{ inputs.spp }}", DRY: "${{ inputs.dry }}", PYTHONUNBUFFERED: "1" }
        run: |
          mkdir -p frames; T0=$(date +%s)
          ~/blender/blender -b ~/assets/host.blend -P render/shorts/${{ inputs.ep }}.py -- $PWD/frames ~/assets 1 1 2>&1 \
            | grep --line-buffered -E "Saved|Error|Traceback|RENDER|MODEL|TIMING|TOUR19|DONE|File \"|line [0-9]|Exception" | grep --line-buffered -v "Fra:" | tee frames/model.log | tail -150 || true
          echo "seconds $(( $(date +%s) - T0 ))" | tee frames/time.txt; ls -la frames
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: check20, path: frames/, retention-days: 2, compression-level: 0 }
